name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Format, lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:boundaries -w web
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/.next
          retention-days: 1
          include-hidden-files: true

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: apps/web/.next

      - run: npm exec -w web -- playwright install --with-deps chromium

      - run: npm run test:e2e -w web
        env:
          CI: "true"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  api:
    name: "API: lint, typecheck, test, build, image"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: abay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d abay"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      LOG_LEVEL: silent
      CORS_ORIGINS: http://localhost:3000
      DATABASE_URL: postgresql://abay_app:app@localhost:5432/abay?schema=public
      DIRECT_DATABASE_URL: postgresql://abay_migrator:migrator@localhost:5432/abay?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The same least-privilege roles docker-compose creates locally.
      - name: Create database roles
        env:
          PGPASSWORD: postgres
        run: psql "postgresql://postgres@localhost:5432/abay" -v ON_ERROR_STOP=1 -f packages/database/sql/roles.sql

      - name: Build shared packages (generates the Prisma client)
        run: npm run build -w @abay/contracts -w @abay/database

      - run: npm run lint -w api
      - run: npm run typecheck -w api

      - name: Apply migrations
        run: |
          if [ -d packages/database/prisma/migrations ]; then
            npm run migrate:deploy -w @abay/database
          else
            echo "no migrations yet"
          fi

      - name: Unit and API tests (real PostgreSQL and Redis)
        run: npm run test:all -w api

      - run: npm run build -w api

      - name: Build the container image
        run: docker build -f apps/api/Dockerfile -t abay-api:ci .

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks reads the PR's commit list to scope its scan to this PR's diff;
    # the workflow-level `contents: read` above isn't enough for that call.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
